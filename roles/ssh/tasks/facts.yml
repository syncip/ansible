---
# Wird vor allen Rollen ausgeführt, damit Firewall und fail2ban die SSH-Ports
# kennen, bevor sshd umkonfiguriert wird.

- name: Laufzeitverzeichnis von sshd sicherstellen (für sshd -T nötig)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"

- name: Effektive sshd-Konfiguration lesen
  ansible.builtin.command: /usr/sbin/sshd -T
  register: ssh_effective
  changed_when: false

- name: SSH-Ports und Login-Modus berechnen
  vars:
    _current_ports: >-
      {{ ssh_effective.stdout_lines | select('match', '^port ') | map('split', ' ') | map('last') | map('int') | list }}
    _root_login: >-
      {{ (ssh_effective.stdout_lines | select('match', '^permitrootlogin ') | first | default('permitrootlogin prohibit-password')).split(' ') | last }}
  ansible.builtin.set_fact:
    ssh_current_ports: "{{ _current_ports }}"
    # prepare: alter + neuer Port parallel (kein Aussperren möglich)
    # finalize: nur noch der neue Port
    ssh_listen_ports: >-
      {{ ((_current_ports + [setup_ssh_port | int]) if setup_phase == 'prepare' else [setup_ssh_port | int]) | unique | list }}
    ssh_old_ports: "{{ _current_ports | difference([setup_ssh_port | int]) }}"
    ssh_harden: "{{ setup_phase == 'finalize' or (setup_finalized | bool) }}"
    ssh_current_root_login: "{{ _root_login }}"

- name: SSH-Ports anzeigen
  ansible.builtin.debug:
    msg: "Phase {{ setup_phase }}: SSH lauscht auf {{ ssh_listen_ports | join(', ') }} (bisher {{ ssh_current_ports | join(', ') }})"
